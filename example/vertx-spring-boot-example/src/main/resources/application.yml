

spring:
  application:
    name: vertx-spring-boot-example
  profiles:
    active: instance1


logging:
  level:
    root: info
    com.workoss.boot.vertx: debug

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

vertx:
  cluster:
    enabled: true
  prefer-native-transport: true
  graceful-shutdown-timeout-seconds: 30

# Zenoh cluster configuration
vertx.cluster.zenoh:
  app-name: vertx-example
  environment: dev
  # instance1 runs the router; instance2/instance3 connect to it as clients
  mode: router
#  listen:
#    - "tcp/127.0.0.1:7447"

