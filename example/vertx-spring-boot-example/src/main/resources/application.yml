

spring:
  application:
    name: vertx-spring-boot-example
  profiles:
    active: instance1


logging:
  level:
    root: info
    com.workoss.boot.vertx: debug

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

vertx:
  cluster:
    enabled: true
  prefer-native-transport: true
  graceful-shutdown-timeout-seconds: 30

# Zenoh cluster configuration
vertx.cluster.zenoh:
  app-name: vertx-example
  environment: dev
  # All three instances are equal PEERS. They auto-discover each other via Zenoh
  # multicast scouting, so any node can start first — no startup ordering required.
  # Each instance overrides `listen` with its own localhost port (see instance ymls).
  mode: peer

